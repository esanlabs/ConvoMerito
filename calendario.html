<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calendario Administrativo · Méritos ESAN</title>
  
  <!-- Tipografías y CSS básico (puedes enlazar tu style.css si lo deseas) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- LIBRERÍAS DE CALENDARIO Y EXPORTACIÓN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <!-- GOOGLE LOGIN -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0d0d0f; color: #fff; margin: 0; padding: 20px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    h1 { font-family: 'Archivo Black', sans-serif; color: #f59e0b; margin: 0; font-size: 24px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    button { background: #222; color: #fff; border: 1px solid #444; padding: 8px 16px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #333; }
    button.active { background: #f59e0b; color: #000; font-weight: bold; }
    button.export-btn { background: #10b981; color: #fff; border: none; }
    button.export-pdf { background: #ef4444; color: #fff; border: none; }
    #calendar-container { background: #151518; padding: 20px; border-radius: 8px; border: 1px solid #333; }
    
    /* Adaptando el calendario al modo oscuro */
    .fc-theme-standard td, .fc-theme-standard th { border-color: #333; }
    .fc-col-header-cell-cushion, .fc-daygrid-day-number { color: #fff; text-decoration: none; }
  </style>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="login-screen" style="text-align: center; margin-top: 100px;">
    <h1>Acceso Administrativo</h1>
    <p style="color:#aaa;">Inicia sesión con tu cuenta de administrador para ver el calendario.</p>
    <div id="g_id_onload" data-client_id="TU_CLIENT_ID_DE_GOOGLE_AQUI.apps.googleusercontent.com" data-callback="handleCredentialResponse"></div>
    <div class="g_id_signin" data-type="standard" data-theme="outline" style="display:inline-block; margin-top:20px;"></div>
    <p id="login-error" style="color:#ef4444; display:none;">No tienes permisos de administrador.</p>
  </div>

  <!-- CONTENIDO DEL CALENDARIO -->
  <div id="app-content" style="display: none;">
    <div class="header-bar">
      <h1>Calendario de Producciones</h1>
      <button onclick="window.location.href='index.html'">Volver a Inicio</button>
    </div>

    <div class="controls">
      <button class="filter-btn active" data-filter="Todos">Todos</button>
      <button class="filter-btn" data-filter="Evento">Eventos</button>
      <button class="filter-btn" data-filter="Permanente">Permanentes</button>
      
      <div style="flex-grow: 1;"></div>
      
      <button class="export-btn" id="exportExcelBtn">⬇ Exportar a Excel</button>
      <button class="export-pdf" id="exportPdfBtn">⬇ Exportar a PDF</button>
    </div>

    <div id="calendar-container">
      <div id="calendar"></div>
    </div>
  </div>

  <script src="calendario.js"></script>
</body>
</html>
